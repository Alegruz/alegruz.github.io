<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" xml:lang="ko" role="img" aria-labelledby="title description">
<title id="title">짝이 맞는 생산량의 상한 선택</title>
<desc id="description">주황 조각별 선형 상한은 부품 I 가중치 2/3에서 최솟값인 하루 260/3 완제품 세트에 도달한다. 파란 수평선은 달성한 생산량이다. 세로축은 80에서 시작한다.</desc>
<rect width="800" height="470" rx="12" fill="#fff"/>
<g font-family="system-ui, sans-serif" font-size="16" fill="#1e293b">
<text x="100" y="36" font-size="19">하루 완제품 세트 수</text>
<text x="100" y="60" font-size="14">세로축 시작값 80</text>
<path d="M95 360.0H700" stroke="#e2e8f0"/>
<text x="52" y="365.0">80</text>
<path d="M95 290.0H700" stroke="#e2e8f0"/>
<text x="52" y="295.0">120</text>
<path d="M95 220.0H700" stroke="#e2e8f0"/>
<text x="52" y="225.0">160</text>
<path d="M95 150.0H700" stroke="#e2e8f0"/>
<text x="52" y="155.0">200</text>
<path d="M95 80.0H700" stroke="#e2e8f0"/>
<text x="52" y="85.0">240</text>
<path d="M100 80V360H700" fill="none" stroke="#64748b"/>
<path d="M100.0 360v6" stroke="#64748b"/>
<text x="100.0" y="390" text-anchor="middle">0</text>
<path d="M400.0 360v6" stroke="#64748b"/>
<text x="400.0" y="390" text-anchor="middle">1/2</text>
<path d="M500.0 360v6" stroke="#64748b"/>
<text x="500.0" y="390" text-anchor="middle">2/3</text>
<path d="M700.0 360v6" stroke="#64748b"/>
<text x="700.0" y="390" text-anchor="middle">1</text>
<path d="M100 348.3333333333333H700" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/>
<polyline points="100.00000,97.50000 460.00000,339.00000 500.00000,348.33333 536.36364,347.27273 700.00000,290.00000" stroke="#c65b08" stroke-width="3" fill="none"/>
<circle cx="500.0" cy="348.3333333333333" r="5" fill="#1e293b"/>
<text x="405" y="280">최솟값 U = 260/3</text>
<text x="405" y="303">짝을 맞춘 계획이 상한 달성</text>
<text x="400" y="430" text-anchor="middle">부품 I 가중치 θ; 부품 II 가중치 1 − θ</text>
<text x="100" y="456" font-size="13">발표된 기계 생산율·용량; 현대적 연속 모형으로 재유도.</text>
</g></svg>
