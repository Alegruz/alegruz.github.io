<svg xmlns="http://www.w3.org/2000/svg" width="860" height="410" viewBox="0 0 860 410" role="img" aria-labelledby="title desc">
<title id="title">Optimal time allocation for Kantorovich’s machine example</title>
<desc id="desc">Milling splits eight ninths of time to Part I and one ninth to Part II. Turret time makes Part I, and automatic time makes Part II. The plant produces 260 over 3 of each part per day.</desc>
<rect width="860" height="410" fill="white"/>
<g font-family="system-ui,sans-serif" fill="#1e293b" font-size="18">
<text x="30" y="35" font-size="24" font-weight="700">Matching parts through machine specialization</text>
<rect x="30" y="55" width="20" height="20" fill="#2563eb"/><text x="60" y="72">Part I</text><rect x="165" y="55" width="20" height="20" fill="#c65b08"/><text x="195" y="72">Part II</text>
<text x="30" y="115">Milling: 3 machine-days</text>
<rect x="290" y="91" width="426.66666666666663" height="32" fill="#2563eb"/>
<rect x="716.6666666666666" y="91" width="53.33333333333337" height="32" fill="#c65b08"/>
<text x="290" y="149" font-size="16">8/3 days I; 1/3 day II</text>
<text x="30" y="200">Turret: 3 machine-days</text>
<rect x="290" y="176" width="480.0" height="32" fill="#2563eb"/>
<rect x="770.0" y="176" width="0.0" height="32" fill="#c65b08"/>
<text x="290" y="234" font-size="16">3 days I; 0 days II</text>
<text x="30" y="285">Automatic: 1 machine-day</text>
<rect x="290" y="261" width="0.0" height="32" fill="#2563eb"/>
<rect x="290.0" y="261" width="480.0" height="32" fill="#c65b08"/>
<text x="290" y="319" font-size="16">0 days I; 1 day II</text>
<text x="30" y="368" font-weight="700">Total Part I = 260/3; total Part II = 260/3</text>
<text x="30" y="395" font-size="16">Equal bar widths mean 100% of each group’s time, not equal machine counts or outputs.</text>
</g></svg>