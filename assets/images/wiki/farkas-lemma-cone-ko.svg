<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 410" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">분리 직선으로 보는 파르카시 증명서</title>
<desc id="desc">직접 만든 예제에서 달성 가능한 벡터는 z1 ≥ z2 ≥ 0인 원뿔을 이룬다. 목표 b = (0,1)은 바깥에 있다. 그 투영 p = (½,½)는 경계 z1 = z2 위에 있다.</desc>
<rect width="650" height="410" fill="#fff"/>
<g font-family="system-ui,sans-serif" font-size="17" fill="#1e293b">
<path d="M110 330 L590 330 L590 42 L398 42 Z" fill="#dbeafe"/>
<path d="M70 330 H610 M110 360 V30" fill="none" stroke="#475569" stroke-width="2"/>
<path d="M110 330 L398 42" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M110 90 L230 210" fill="none" stroke="#c65b08" stroke-width="2"/>
<circle cx="110" cy="90" r="6" fill="#c65b08"/>
<circle cx="230" cy="210" r="6" fill="#2563eb"/>
<text x="122" y="82">b = (0,1)</text>
<text x="240" y="225">p = (½,½)</text>
<text x="365" y="275">달성 가능한 원뿔 K</text>
<text x="300" y="125" transform="rotate(-45 300 125)">z₁ − z₂ = 0</text>
<text x="80" y="353">0</text>
<path d="M350 324 V336 M104 90 H116" stroke="#475569"/>
<text x="346" y="355">1</text><text x="88" y="96">1</text>
<text x="610" y="352">z₁</text><text x="86" y="30">z₂</text>
<text x="160" y="385">두 축의 축척은 같고 음영 영역은 바깥으로 계속된다.</text>
</g>
</svg>
