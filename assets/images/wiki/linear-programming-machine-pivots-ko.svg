<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">역사적 기계 모형의 가능 영역에서 개선하는 두 교환</title>
<desc id="desc">터릿선반 시간 t와 자동선반 시간 a의 가능 다각형은 꼭짓점 (14/5,0), (3,0), (3,8/11), (12/5,1), (3/5,1)을 갖는다. 개선 경로는 (12/5,1)에서 (3,8/11)을 거쳐 (3,0)으로 간다.</desc>
<rect width="860" height="480" fill="white"/>
<g font-family="system-ui,sans-serif" font-size="17" fill="#1e293b">
<text x="30" y="35" font-size="23" font-weight="700">부품 수의 일치를 유지하는 두 교환</text>
<text x="30" y="68">a: 부품 I의 자동선반 기계·일</text>
<path d="M90.0 100V380" stroke="#e2e8f0"/>
<text x="90.0" y="410" text-anchor="middle">0</text>
<path d="M260.0 100V380" stroke="#e2e8f0"/>
<text x="260.0" y="410" text-anchor="middle">1</text>
<path d="M430.0 100V380" stroke="#e2e8f0"/>
<text x="430.0" y="410" text-anchor="middle">2</text>
<path d="M600.0 100V380" stroke="#e2e8f0"/>
<text x="600.0" y="410" text-anchor="middle">3</text>
<path d="M90 380.0H600" stroke="#e2e8f0"/>
<text x="75" y="386.0" text-anchor="end">0</text>
<path d="M90 250.0H600" stroke="#e2e8f0"/>
<text x="75" y="256.0" text-anchor="end">1/2</text>
<path d="M90 120.0H600" stroke="#e2e8f0"/>
<text x="75" y="126.0" text-anchor="end">1</text>
<polygon points="566.0,380.0 600.0,380.0 600.0,190.9090909090909 498.0,120.0 192.0,120.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<path d="M90 100V380H625" fill="none" stroke="#1e293b" stroke-width="2"/>
<polyline points="498.0,120.0 600.0,190.9090909090909 600.0,380.0" fill="none" stroke="#c65b08" stroke-width="4"/>
<circle cx="566.0" cy="380.0" r="5" fill="#2563eb"/>
<circle cx="600.0" cy="380.0" r="5" fill="#c65b08"/>
<circle cx="600.0" cy="190.9090909090909" r="5" fill="#c65b08"/>
<circle cx="498.0" cy="120.0" r="5" fill="#c65b08"/>
<circle cx="192.0" cy="120.0" r="5" fill="#2563eb"/>
<text x="482" y="106" text-anchor="middle">시작: (12/5, 1)</text>
<text x="625" y="192">(3, 8/11)</text>
<text x="625" y="365" font-weight="700">(3, 0): 최적</text>
<text x="628" y="390">z = 260/3</text>
<text x="184" y="106">(3/5, 1)</text>
<text x="545" y="368" text-anchor="end">(14/5, 0)</text>
<text x="290" y="440">t: 부품 I의 터릿선반 기계·일</text>
<text x="30" y="469" font-size="16">밀링 한계가 기울어진 변을 정한다: 140 ≤ 50t + 110a ≤ 230.</text>
</g></svg>
